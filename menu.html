<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#08355C;
    --mid:#146FA6;
    --light:#5FB4E0;
    --glass:rgba(255,255,255,0.10);
    --glass-border:rgba(255,255,255,0.22);
    --ink:#FFFFFF;
    --ink-soft:rgba(255,255,255,0.72);
    --gold:#F2C14E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(160deg, var(--deep) 0%, var(--mid) 55%, var(--light) 100%);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:3.2vh 2.6vw 2vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,0.10) 0%, transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,255,255,0.08) 0%, transparent 45%);
    pointer-events:none;
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    margin-bottom:2.4vh;
    position:relative;
  }
  .shop-name{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem, 4.6vw, 3.8rem);
    letter-spacing:-0.01em;
    margin:0;
    line-height:1.05;
  }
  .tagline{
    font-size:clamp(0.85rem, 1.3vw, 1.05rem);
    color:var(--ink-soft);
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin:0.5rem 0 0;
    font-weight:500;
  }
  .wave{
    display:block;
    width:260px;
    height:16px;
    margin:1rem auto 0;
    opacity:0.85;
  }

  /* ---------- Grid ---------- */
  .board{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(340px, 1fr));
    gap:1.3vw;
    max-width:1650px;
    margin:0 auto;
    position:relative;
  }
  .board.few-categories{ max-width:1150px; }
  .board.few-categories .item-name{ font-size:1.16rem; }
  .board.few-categories .item-desc{ font-size:0.9rem; }
  .board.few-categories .item-price{ font-size:1.22rem; }
  .board.few-categories .cat-name{ font-size:clamp(1.6rem, 2.4vw, 2.1rem); }
  .board.few-categories .item-thumb{ width:60px; height:60px; }

  .category{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:26px;
    padding:1.5rem 1.6rem 1.4rem;
    border:1px solid var(--glass-border);
  }

  .cat-header{
    display:flex;
    align-items:center;
    gap:0.6rem;
    margin-bottom:0.7rem;
  }
  .cat-name{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:clamp(1.3rem, 1.9vw, 1.6rem);
    color:var(--gold);
    margin:0;
  }
  .cat-underline{
    height:3px;
    width:42px;
    background:var(--gold);
    border-radius:3px;
    margin:0 0 0.9rem;
    opacity:0.85;
  }

  .item{
    display:flex;
    align-items:center;
    gap:0.7rem;
    padding:0.5rem 0;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  .item:last-child{ border-bottom:none; }

  .item-thumb{
    width:46px;
    height:46px;
    border-radius:12px;
    object-fit:cover;
    flex-shrink:0;
    background:rgba(255,255,255,0.08);
  }

  .item-info{ flex:1; min-width:0; }
  .item-name{
    font-weight:500;
    font-size:0.98rem;
    margin:0;
  }
  .item-desc{
    font-size:0.76rem;
    color:var(--ink-soft);
    margin:0.1rem 0 0;
    line-height:1.3;
  }
  .item-price{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:1rem;
    color:var(--gold);
    white-space:nowrap;
  }
  .badge{
    display:inline-block;
    font-size:0.6rem;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--deep);
    padding:0.1rem 0.4rem;
    border-radius:20px;
    margin-left:0.4rem;
    vertical-align:2px;
  }
  .unsure{
    font-size:0.62rem;
    color:#FFD9D9;
    font-weight:600;
    margin-left:0.35rem;
  }

  footer{
    text-align:center;
    margin-top:2.2vh;
    font-size:0.76rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    position:relative;
  }
</style>
</head>
<body>

<header>
  <p class="tagline" id="tagline-out"></p>
  <h1 class="shop-name" id="name-out"></h1>
  <svg class="wave" viewBox="0 0 260 16" preserveAspectRatio="none">
    <path d="M0 8 Q 10 0, 20 8 T 40 8 T 60 8 T 80 8 T 100 8 T 120 8 T 140 8 T 160 8 T 180 8 T 200 8 T 220 8 T 240 8 T 260 8"
    fill="none" stroke="#F2C14E" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
</header>

<main class="board" id="board"></main>

<footer id="footer-out"></footer>

<script>
/* ======================================================================
   EDIT YOUR MENU HERE — everything below this box is safe to change.

   ADDING PHOTOS: upload your photos into an "images" folder next to
   this file (same repository), then add a line like:
       img: "images/lotusella.jpg"
   to any item. If you skip "img" for an item, it just shows text —
   nothing breaks. Square photos (roughly same width and height) look best.

   Each category has a "screen" number: 1, 2, or 3 — that's what decides
   which TV it shows up on.

   Do NOT touch anything after the "STOP EDITING" line further down.
====================================================================== */

const SHOP = {
  name: "Bluestreet",
  tagline: "Crepes · Waffles · Cakes · Coffee",
  footer: "Milk alternative +1 · Upsize +0.50 · Extra flavor +1 · Extra shot +2"
};

const MENU = [
  {
    name: "Crepes & Waffles",
    screen: 1,
    items: [
      { name: "Bluestreet Special", price: 19.90, desc: "Lotus Butter & Biscoff, Milk Chocolate, Oreo, Pistachio, Strawberry & Banana" },
      { name: "Lotusella", price: 17.90, desc: "Nutella, Strawberry & Banana, Lotus Butter & Biscoff" },
      { name: "Dubai Chocolate", price: 19.90, desc: "Milk Chocolate, Kunafa Filling, Butter & Crushed Pistachio" },
      { name: "Oreo", price: 15.90, desc: "Nutella, Banana, Oreo, White Chocolate Drizzle" },
      { name: "Cheesecake Melt", price: 15.90, desc: "Milk & White Chocolate, Cheesecake Bites, Strawberry" },
      { name: "Biscoff", price: 15.90, desc: "Lotus Butter, Biscoff, Banana, White Choc Drizzle" },
      { name: "Ferrero", price: 15.90, desc: "Nutella, Strawberry, Ferrero, White Choc Drizzle" },
      { name: "Kinder", price: 15.90, desc: "Nutella, Kinder Bueno & Stick, White Choc Drizzle" },
      { name: "Triple Chocolate", price: 15.90, desc: "Milk, White & Dark Chocolate" },
      { name: "Strawberry Banana", price: 16.90, desc: "Nutella, Strawberry & Banana" },
      { name: "Pistachio", price: 17.90, desc: "Butter & Crushed Pistachio, Banana, White Choc Drizzle" },
      { name: "Red Velvet", price: 15.90, desc: "Nutella, Red Velvet Cake, Strawberry, White Choc Drizzle" },
      { name: "Fudgin Browni", price: 15.90, desc: "Milk Chocolate, Brownie Bites, Strawberry, White Choc Drizzle" },
      { name: "Nutella Dream", price: 14.90, desc: "Only Nutella" }
    ]
  },
  {
    name: "Cakes",
    screen: 2,
    items: [
      { name: "Dubai Chocolate (cup)", price: 18.90, unsure: true },
      { name: "Strawberry Choc (cup)", price: 16.90 },
      { name: "Lava Cake", price: 9.90, unsure: true },
      { name: "Chocolate Chip Melt", price: 9.90, unsure: true },
      { name: "Tiramisu", price: 9.90 },
      { name: "Brownie", price: 8.90 },
      { name: "Chocolate Cake", price: 8.90 },
      { name: "Red Velvet Cake", price: 8.90 },
      { name: "Cheesecake", price: 8.90 }
    ]
  },
  {
    name: "Shakes",
    screen: 2,
    items: [
      { name: "Ferrero", price: 11.90, desc: "Nutella, Crushed Hazelnut, Ferrero Rocher" },
      { name: "Biscoff", price: 11.90, desc: "Lotus Butter, Lotus Cookies" },
      { name: "Oreo", price: 11.90, desc: "Crushed Oreos" },
      { name: "Dubai Chocolate", price: 12.90, desc: "Nutella, Pistachio, Kunafa" },
      { name: "Kinder", price: 11.90, desc: "Nutella, Kinder" },
      { name: "Strawberry Shortcake", price: 11.90, desc: "Cheesecake, Strawberry Sauce" },
      { name: "Pistachio", price: 12.90, desc: "Pistachio Butter, Crushed Pistachio" },
      { name: "Fudgin Brownie", price: 11.90, desc: "Nutella, Brownie Bites" },
      { name: "Red Velvet", price: 11.90, desc: "Red Velvet Cake" },
      { name: "Classic", price: 10.90, desc: "Vanilla, Strawberry" }
    ]
  },
  {
    name: "Refreshers & Mojitos",
    screen: 2,
    items: [
      { name: "Redberry", price: 6.90, desc: "Strawberry, Raspberry" },
      { name: "Pina Colada", price: 6.90, desc: "Coconut, Pineapple" },
      { name: "Summer", price: 6.90, desc: "Peach, Watermelon" },
      { name: "Passion Fruit", price: 6.90, desc: "Strawberry, Mango" },
      { name: "Blue Raspberry", price: 6.90, desc: "Blue Raspberry" },
      { name: "Dragon Fruit", price: 6.90, desc: "Dragon Fruit" }
    ]
  },
  {
    name: "Coffee & Tea",
    screen: 3,
    items: [
      { name: "Drip Coffee", price: 3.90 },
      { name: "Espresso", price: 3.90 },
      { name: "Americano", price: 3.90 },
      { name: "Macchiato", price: 4.90 },
      { name: "Cortado", price: 4.90 },
      { name: "Latte", price: 5.90 },
      { name: "Cold Brew", price: 5.90 },
      { name: "Iced Coffee", price: 4.90 },
      { name: "Cappuccino / Flat White", price: 4.90 },
      { name: "Matcha Latte", price: 6.90 },
      { name: "Spanish Latte", price: 6.90 },
      { name: "Brown Sugar Latte", price: 6.90 },
      { name: "Pistachio Latte", price: 6.90 },
      { name: "Lotus Latte", price: 6.90 },
      { name: "Blue Special Latte", price: 7.90 },
      { name: "Hot Chocolate", price: 5.90 },
      { name: "Hot / Iced Tea", price: 4.90 },
      { name: "Turkish Coffee", price: 5.90 }
    ]
  }
];

/* ==================== STOP EDITING BELOW THIS LINE ==================== */

document.getElementById("name-out").textContent = SHOP.name;
document.getElementById("tagline-out").textContent = SHOP.tagline;
document.getElementById("footer-out").textContent = SHOP.footer;

const board = document.getElementById("board");

const params = new URLSearchParams(window.location.search);
const screenNum = params.get("screen");
const visibleCategories = screenNum
  ? MENU.filter(cat => String(cat.screen) === screenNum)
  : MENU;

if (visibleCategories.length <= 2) {
  board.classList.add("few-categories");
}

visibleCategories.forEach(cat => {
  const section = document.createElement("section");
  section.className = "category";

  const itemsHTML = cat.items.map(item => `
    <div class="item">
      ${item.img ? `<img class="item-thumb" src="${item.img}" alt="">` : ""}
      <div class="item-info">
        <p class="item-name">${item.name}${item.badge ? `<span class="badge">${item.badge}</span>` : ""}${item.unsure ? `<span class="unsure">check price</span>` : ""}</p>
        ${item.desc ? `<p class="item-desc">${item.desc}</p>` : ""}
      </div>
      <span class="item-price">$${Number(item.price).toFixed(2)}</span>
    </div>
  `).join("");

  section.innerHTML = `
    <div class="cat-header">
      <h2 class="cat-name">${cat.name}</h2>
    </div>
    <div class="cat-underline"></div>
    ${itemsHTML}
  `;

  board.appendChild(section);
});

setInterval(() => {
  const url = new URL(window.location.href);
  url.searchParams.set("_t", Date.now());
  window.location.href = url.toString();
}, 5 * 60 * 1000);
</script>
</body>
</html>
